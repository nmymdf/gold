name: 更新金價

on:
  schedule:
    # 以下為 UTC 時間（台灣時間 = UTC+8）
    - cron: "40 2 * * 1-6"   # 10:40 銀樓牌價、台銀開盤
    - cron: "15 4 * * 1-5"   # 12:15 台銀中午
    - cron: "45 7 * * 1-5"   # 15:45 台銀收盤
    - cron: "5 13 * * 1-5"   # 21:05 補抓（前面排程若延遲或失敗）
  workflow_dispatch:
    inputs:
      backfill:
        description: "補抓銀樓歷史資料"
        type: boolean
        default: false
  push:
    paths: [scripts/fetch.py, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取牌價
        run: python3 scripts/fetch.py ${{ (inputs.backfill || github.event_name == 'push') && '--backfill' || '' }}
      - name: 提交資料
        if: always()
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新金價 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
